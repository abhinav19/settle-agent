[project]
name = "settleagent-mcp-servers"
version = "0.1.0"
description = "Four read-only MCP tool servers over synthetic reference data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["security_master", "ssi_store", "holiday_calendar", "trade_store", "_shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["_shared", "security_master", "ssi_store", "holiday_calendar", "trade_store"]
branch = true
