[project]
name = "settleagent"
version = "0.1.0"
description = "SettleAgent core: consumer, LangGraph investigation agent, gate, remediation, API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.60",
    "confluent-kafka>=2.5",
    "langgraph>=0.2",
    "mcp>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "hypothesis>=6.168.5",
    "settleagent-mcp-servers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settleagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]

[tool.coverage.run]
source = ["src/settleagent"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.uv.sources]
settleagent-mcp-servers = { path = "../mcp-servers", editable = true }

[[tool.mypy.overrides]]
module = ["security_master.*", "ssi_store.*", "holiday_calendar.*", "trade_store.*", "_shared.*"]
follow_untyped_imports = true
