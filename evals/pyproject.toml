[project]
name = "settleagent-evals"
version = "0.1.0"
description = "Evaluation harness: runs the real agent over 300 labelled cases and scores it."
requires-python = ">=3.12,<3.13"
dependencies = [
    "settleagent",
    "settleagent-mcp-servers",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "hypothesis>=6.100",
]

[tool.uv.sources]
settleagent = { path = "../agent-core", editable = true }
settleagent-mcp-servers = { path = "../mcp-servers", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["evalharness"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dataset", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["settleagent.*", "security_master.*", "ssi_store.*", "holiday_calendar.*", "trade_store.*", "_shared.*"]
follow_untyped_imports = true
