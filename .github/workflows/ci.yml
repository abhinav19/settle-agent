name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [agent-core, mcp-servers, dashboard, evals]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov --cov-report=json:coverage.json --cov-fail-under=80 -q
      - name: Safety-critical coverage gate (>=90% on gate, domain, remediation, consumer)
        if: matrix.project == 'agent-core'
        run: python3 ../scripts/check_coverage.py coverage.json --min 90
      - run: uvx pip-audit --strict || true # TODO: make blocking once baseline is clean

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B spotless:check verify

  docker:
    # Builds every image (does not push) and validates the compose file, so a broken COPY path or a
    # missing build dependency is caught here and not at deploy time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make docker-build
      - name: Validate the full-stack compose profile
        run: docker compose --profile app config -q
        env:
          API_KEY: ci-placeholder-key-0123456789
